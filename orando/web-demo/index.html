<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Orando · Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Orando — oraciones y rezos católicos, Rosario guiado, misas cercanas y adoración. Demo web.">
<meta name="theme-color" content="#dcebfb">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="light">
<!--
  Política de Seguridad de Contenido (CSP) estricta.
  - script-src 'self' (+ GoatCounter opcional): bloquea scripts inyectados.
  - object/base/default 'none': sin plugins, sin <base> malicioso.
  Nota: para ver el demo en local usa un servidor estático
  (p.ej. `python3 -m http.server`) y abre http://localhost:8000
  — abrirlo con doble clic (file://) lo bloquea la CSP, es intencional.
  El resto de cabeceras (frame-ancestors, HSTS, etc.) van en _headers /
  netlify.toml / .htaccess al publicarlo.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; script-src 'self' https://gc.zgo.at; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://formspree.io https://*.goatcounter.com; form-action 'self'; manifest-src 'self'; object-src 'none'">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <!-- Bienvenida animada (se oculta sola o al tocar) -->
  <div id="splash" role="dialog" aria-label="Bienvenida a Orando">
    <div class="splash-inner">
      <div class="splash-cross" aria-hidden="true">
        <svg class="sp sp1" viewBox="0 0 24 24"><path d="M12 2l1.6 8.4L22 12l-8.4 1.6L12 22l-1.6-8.4L2 12l8.4-1.6z"/></svg>
        <svg class="sp sp2" viewBox="0 0 24 24"><path d="M12 2l1.6 8.4L22 12l-8.4 1.6L12 22l-1.6-8.4L2 12l8.4-1.6z"/></svg>
        <svg class="sp sp3" viewBox="0 0 24 24"><path d="M12 2l1.6 8.4L22 12l-8.4 1.6L12 22l-1.6-8.4L2 12l8.4-1.6z"/></svg>
        <svg class="cross-svg" viewBox="0 0 24 24"><rect x="10.4" y="3" width="3.2" height="18" rx="1.2"/><rect x="6" y="8" width="12" height="3.2" rx="1.2"/></svg>
      </div>
      <h1 class="splash-title">Orando</h1>
      <p class="splash-sub">Oraciones y rezos católicos</p>
      <p class="splash-hint">Toca para entrar</p>
    </div>
  </div>

  <div id="frame">
    <header class="bar">
      <button class="back" id="back" type="button" aria-label="Atrás">‹</button>
      <h1 id="title">Orando</h1>
      <button class="heart" id="heart" type="button" aria-label="Apoyar a Orando" title="Apoyar a Orando">♥</button>
      <span class="spark" id="spark" aria-hidden="true"></span>
    </header>
    <main id="view"></main>
    <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
  </div>
  <aside id="panel" hidden aria-label="Panel de impacto"></aside>

  <!-- Orden de carga: configuración → datos → aplicación (POO) -->
  <script src="assets/config.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
