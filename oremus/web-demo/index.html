  main{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:4px 18px 24px}

/* ============================================================= *
 *  ANALÍTICA DE PLATAFORMA  (Android / iOS / Escritorio)
 *  Pon tu código de GoatCounter (gratis, sin cookies) o usa
 *  Cloudflare Web Analytics. Instrucciones en web-demo/README.md
 * ============================================================= */
const ANALYTICS = { goatcounterCode: "" }; // p.ej. "oremus" -> oremus.goatcounter.com

function detectPlatform(){
  const ua = navigator.userAgent || "";
  if(/android/i.test(ua)) return "Android";
  if(/iphone|ipad|ipod/i.test(ua)) return "iOS";
  if(/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) return "iOS"; // iPadOS
  return "Escritorio";
}
const PLATFORM = detectPlatform();

function bump(){
  try{
    const k="oremus.demo.counts";
    const c=JSON.parse(localStorage.getItem(k)||"{}");
    c[PLATFORM]=(c[PLATFORM]||0)+1;
    localStorage.setItem(k,JSON.stringify(c));
  }catch(e){}
}
function renderPanel(){
  const p=new URLSearchParams(location.search);
  if(p.get("panel")!=="1")return;
  const c=JSON.parse(localStorage.getItem("oremus.demo.counts")||"{}");
  document.getElementById("pA").textContent=c["Android"]||0;
  document.getElementById("pI").textContent=c["iOS"]||0;
  document.getElementById("pD").textContent=c["Escritorio"]||0;
  document.getElementById("panel").style.display="block";
}
function sendAnalytics(){
  const code=ANALYTICS.goatcounterCode;
  if(!code) return;
  const s=document.createElement("script");
  s.async=true; s.src="//gc.zgo.at/count.js";
  s.setAttribute("data-goatcounter","https://"+code+".goatcounter.com/count");
  s.onload=function(){
    if(window.goatcounter&&window.goatcounter.count){
      window.goatcounter.count({path:"plataforma/"+PLATFORM,title:"Plataforma "+PLATFORM,event:true});
    }
  };
  document.body.appendChild(s);
}

const SALVE='Dios te salve, Reina y Madre de misericordia, vida, dulzura y esperanza nuestra; Dios te salve… ¡Oh clemente, oh piadosa, oh dulce Virgen María!';

const ADORATION=[
  ['Ponerse en presencia','Haz la señal de la Cruz. Serénate. Jesús está aquí, vivo y verdadero. No vienes a hacer cosas, sino a estar con Él. Dile: «Aquí estoy, Señor.»'],
  ['Adorar','«Te adoro, Jesús Sacramentado. Tú eres mi Dios y mi Señor.» Deja que tu corazón se incline ante tanto amor escondido en la Hostia.'],
  ['Dar gracias','Recuerda los dones de tu vida: la fe, quienes amas, el pan de cada día. «Gracias, Señor, por todo lo que me has dado.»'],
  ['Pedir perdón','Mira tu corazón con paz. «Ten piedad de mí, Señor. Purifica lo que hay de sombra en mí y sáname.»'],
  ['Escuchar y contemplar','Ahora calla y escucha. Deja que sea Él quien te mire. «Habla, Señor, que tu siervo escucha.»'],
  ['Ofrecer y pedir','Presenta a Jesús tu familia, los enfermos, la Iglesia, el mundo. Ofrécele tu jornada unida a la suya.'],
  ['Con María, despedirse','Reza un Ave María. «Quédate conmigo, Señor, para que salga llevándote a los demás.» Haz la señal de la Cruz.']
];
const VERSES=[
  ['«Venid a mí todos los que estáis cansados y agobiados, y yo os aliviaré.»','Mateo 11, 28'],
  ['«El Señor es mi pastor, nada me falta.»','Salmo 23, 1'],
  ['«Todo lo puedo en Aquel que me conforta.»','Filipenses 4, 13'],
  ['«No temas, porque yo estoy contigo.»','Isaías 41, 10'],
  ['«Buscad primero el Reino de Dios y su justicia.»','Mateo 6, 33']
];

/* ============================================================= *
 *  NAVEGACIÓN Y RENDER
 * ============================================================= */
const view=document.getElementById('view'), titleEl=document.getElementById('title'),
      backBtn=document.getElementById('back'), tabsEl=document.getElementById('tabs');
let stack=[];

const TABS=[
  {id:'inicio', label:'Inicio', icon:'home'},
  {id:'oraciones', label:'Oraciones', icon:'book'},
  {id:'rosario', label:'Rosario', icon:'rosary'},
  {id:'misas', label:'Misas', icon:'pin'},
  {id:'adorar', label:'Adorar', icon:'host'}
];
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderTabs(active){
  tabsEl.innerHTML=TABS.map(t=>`<button class="${t.id===active?'on':''}" onclick="go('${t.id}')">${SVG[t.icon]}<span>${t.label}</span></button>`).join('');
}
function setHeader(title, canBack){ titleEl.textContent=title; backBtn.style.display=canBack?'block':'none'; }
backBtn.onclick=()=>{ if(stack.length>1){stack.pop(); render(stack[stack.length-1]);} };

const rowHTML=(icon,rt,rs,onclick)=>`<button class="row" onclick="${onclick}"><span class="ic">${SVG[icon]}</span><span class="tx"><span class="rt">${esc(rt)}</span>${rs?`<span class="rs">${esc(rs)}</span>`:''}</span><span class="chev">›</span></button>`;

function go(tab){ stack=[{v:tab}]; render({v:tab}); renderTabs(tab); }
function push(state){ stack.push(state); render(state); }

function render(state){
  const v=state.v; view.scrollTop=0;
  ({inicio:renderInicio, oraciones:renderOraciones, cat:()=>renderCat(state.cat),
    prayer:()=>renderPrayer(state.cat,state.i), rosario:renderRosario, guia:renderGuia,
    rezo:renderRezo, misas:renderMisas, adorar:renderAdorar}[v])();
}

function renderInicio(){
  renderTabs('inicio'); setHeader('Oremus',false);
  const h=new Date().getHours();
  const saludo=h<12?'Buenos días':h<20?'Buenas tardes':'Buenas noches';
  const vs=VERSES[Math.floor(Date.now()/8.64e7)%VERSES.length];
  const my=mysteriesForToday();
  view.innerHTML=`
    <div style="margin:8px 0 2px"><span class="device-chip">📱 Estás en&nbsp;<b>${PLATFORM}</b></span></div>
    <h2 class="t" style="font-size:30px">${saludo}</h2>
    <p class="sub">${new Date().toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})}</p>
    <div class="card hero">
      <div class="kicker">Palabra del día</div>
      <p class="verse" style="font-size:18px;margin:12px 0 8px">${vs[0]}</p>
      <p class="muted" style="font-weight:600">${vs[1]}</p>
    </div>
    <div class="kicker" style="margin:16px 0 8px">Para hoy</div>
    <div class="card" style="padding:4px 16px">
      ${rowHTML('rosary','Rosario de hoy',my.name+' · '+my.days,"go('rosario')")}
      ${rowHTML('pin','Misas cerca de ti','Según tu ubicación',"go('misas')")}
      ${rowHTML('host','15 min ante el Santísimo','Adoración guiada',"go('adorar')")}
      ${rowHTML('book','Oraciones','Antes y después de misa, y más',"go('oraciones')")}
    </div>`;
}
function renderOraciones(){
  renderTabs('oraciones'); setHeader('Oraciones',false);
  const n=CATS.reduce((a,c)=>a+c.prayers.length,0);
  view.innerHTML=`<p class="sub">${n} rezos · toca una categoría</p>
    <div class="card" style="padding:4px 16px">
      ${CATS.map(c=>rowHTML(c.icon,c.title,c.sub,`push({v:'cat',cat:'${c.id}'})`)).join('')}
    </div>`;
}
function renderCat(id){
  const c=CATS.find(x=>x.id===id);
  renderTabs('oraciones'); setHeader(c.title,true);
  view.innerHTML=`<div class="card" style="padding:4px 16px">
    ${c.prayers.map((p,i)=>rowHTML(c.icon,p.t, p.p[0].slice(0,52)+'…', `push({v:'prayer',cat:'${id}',i:${i}})`)).join('')}
  </div>`;
}
function renderPrayer(id,i){
  const c=CATS.find(x=>x.id===id), p=c.prayers[i];
  renderTabs('oraciones'); setHeader(p.t,true);
  view.innerHTML=`<div class="card hero">${p.p.map(x=>`<p class="verse" style="margin:0 0 16px">${x}</p>`).join('')}</div>`;
}
function renderRosario(){
  renderTabs('rosario'); setHeader('Santo Rosario',false);
  const my=mysteriesForToday();
  view.innerHTML=`
    <div class="card hero">
      <div class="kicker">Rosario de hoy</div>
      <h2 class="t" style="font-size:24px;margin:8px 0 2px">${my.name}</h2>
      <p class="muted">${my.days}</p>
      <button class="btn gold" style="margin-top:14px" onclick="push({v:'rezo'})">▶ Rezar guiado</button>
    </div>
    <div class="card" style="padding:4px 16px">
      ${rowHTML('book','Cómo se reza, paso a paso','Con las oraciones y qué misterios según el día',"push({v:'guia'})")}
    </div>
    <div class="kicker" style="margin:16px 0 8px">Todos los misterios</div>
    <div class="card" style="padding:4px 16px">
      ${Object.values(MYSTERIES).map(m=>rowHTML('rosary',m.name,m.days,"push({v:'rezo'})")).join('')}
    </div>`;
}
function renderGuia(){
  renderTabs('rosario'); setHeader('Cómo rezar el Rosario',true);
  view.innerHTML=GUIDE.map((s,i)=>`<div class="card"><div style="display:flex;gap:14px">
    <div style="flex:none;width:34px;height:34px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;font-weight:700">${i+1}</div>
    <div><div style="font-family:var(--display);font-size:18px">${s[0]}</div><div class="muted" style="font-size:14px;margin-top:2px">${s[1]}</div></div>
  </div></div>`).join('') + `<div class="card hero"><div class="kicker">Oración de Fátima</div><p class="verse" style="margin-top:8px">${FA}</p></div>`;
}
let rezoSteps=[], rezoI=0;
function buildRezo(){
  const my=mysteriesForToday(); const s=[];
  s.push(['Para comenzar','Señal de la Cruz','Por la señal de la Santa Cruz… En el nombre del Padre, y del Hijo, y del Espíritu Santo. Amén.',null]);
  s.push(['Para comenzar','Padre Nuestro',PN,null]);
  for(let k=1;k<=3;k++) s.push(['Fe, esperanza y caridad','Ave María ('+k+'ª)',AM,null,true]);
  s.push(['Para comenzar','Gloria',GL,null]);
  my.list.forEach((m,mi)=>{
    s.push([(mi+1)+'º misterio · '+my.name,m[0],m[1],null]);
    s.push(['Decena '+(mi+1),'Padre Nuestro',PN,null]);
    for(let b=1;b<=10;b++) s.push(['Decena '+(mi+1)+' de 5','Ave María',AM,b,true]);
    s.push(['Decena '+(mi+1),'Gloria',GL,null]);
    s.push(['Decena '+(mi+1),'Oración de Fátima',FA,null]);
  });
  s.push(['Para terminar','Salve',SALVE,null]);
  return s;
}
function renderRezo(){
  renderTabs('rosario'); setHeader('Rezar el Rosario',true);
  if(!rezoSteps.length){rezoSteps=buildRezo();rezoI=0;}
  drawRezo();
}
let amTimer=null;
function rezoNext(){ if(rezoI<rezoSteps.length-1){ rezoI++; drawRezo(); } else { rezoSteps=[]; go('rosario'); } }
function rezoPrev(){ if(rezoI>0){ rezoI--; drawRezo(); } }
function revealAm2(){ clearTimeout(amTimer); const e=document.getElementById('am2'); if(e){ e.style.opacity='1'; e.style.transform='none'; } const h=document.getElementById('am2hint'); if(h)h.style.display='none'; }
function drawRezo(){
  clearTimeout(amTimer);
  const st=rezoSteps[rezoI], pct=Math.round((rezoI+1)/rezoSteps.length*100);
  let beads='';
  if(st[3]!==null){ beads='<div class="beads">'+Array.from({length:10},(_,k)=>{const n=k+1;const cl=n<st[3]?'done':n===st[3]?'now':'';return '<span class="bead '+cl+'"></span>';}).join('')+'</div>'; }
  // El Ave María se reza en dos partes: la respuesta ("Santa María…") aparece a los 5 s.
  const body = st[4]
    ? `<p class="verse">${AM1}</p>
       <p class="verse" id="am2" style="opacity:0;transform:translateY(6px);transition:opacity 1.1s ease,transform 1.1s ease;margin-top:16px">${AM2}</p>
       <p class="muted" id="am2hint" style="margin:10px 0 0;font-size:11.5px">Toca para ver la respuesta…</p>`
    : `<p class="verse">${st[2]}</p>`;
  view.innerHTML=`
    <div style="display:flex;align-items:center;gap:12px;margin:6px 0 14px">
      <div class="prog"><i style="width:${pct}%"></i></div>
      <span class="muted" style="font-weight:600">${rezoI+1}/${rezoSteps.length}</span>
    </div>
    <div class="kicker">${st[0]}</div>
    <h2 class="t" style="font-size:26px;margin:8px 0">${st[1]}</h2>
    ${beads}
    <div class="card hero" ${st[4]?'onclick="revealAm2()" style="cursor:pointer"':''}>${body}</div>
    <div style="display:flex;gap:10px;margin-top:6px">
      ${rezoI>0?'<button class="btn ghost" style="flex:0 0 40%" onclick="rezoPrev()">Anterior</button>':''}
      <button class="btn gold" onclick="rezoNext()">${rezoI<rezoSteps.length-1?'Siguiente':'Terminar'}</button>
    </div>`;
  if(st[4]){ amTimer=setTimeout(()=>{ revealAm2(); const h=document.getElementById('am2hint'); if(h)h.style.display='none'; },5000); }
}
function renderMisas(){
  renderTabs('misas'); setHeader('Misas cerca',false);
  view.innerHTML=`
    <p class="sub">Encuentra iglesias y parroquias católicas cerca de ti y abre las indicaciones para llegar.</p>
    <div id="misasCard" class="card hero" style="text-align:center;padding:24px">
      <div style="width:64px;height:64px;border-radius:50%;background:rgba(198,143,44,.14);display:grid;place-items:center;margin:0 auto 14px">
        <svg viewBox="0 0 24 24" style="width:32px;height:32px;stroke:var(--gold);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><path d="M12 21c4.6-3 6.5-6.2 6.5-10a6.5 6.5 0 10-13 0c0 3.8 1.9 7 6.5 10z"/><circle cx="12" cy="11" r="2.3"/></svg>
      </div>
      <h2 class="t" style="font-size:22px">Buscar cerca de mí</h2>
      <p class="muted" style="margin:6px 0 16px">Usaremos tu ubicación solo en este momento para mostrarte iglesias cercanas.</p>
      <button class="btn gold" onclick="locate()">📍 Usar mi ubicación</button>
    </div>
    <div class="card"><div class="muted">Los horarios exactos de cada misa los publica la propia parroquia. Al abrir Mapas verás su ficha con teléfono y web para confirmarlos. Tu ubicación se usa solo aquí y no se guarda.</div></div>`;
}
function locate(){
  const c=document.getElementById('misasCard');
  if(!navigator.geolocation){ c.innerHTML='<p class="muted">Tu navegador no permite geolocalización. <a target="_blank" rel="noopener" href="https://www.google.com/maps/search/iglesia+catolica+cerca">Buscar iglesias en Mapas</a></p>'; return; }
  c.innerHTML='<p class="muted">Buscando tu ubicación…</p>';
  navigator.geolocation.getCurrentPosition(pos=>{
    const la=pos.coords.latitude, lo=pos.coords.longitude;
    c.innerHTML=`<div class="kicker">Ubicación lista</div>
      <p class="muted" style="margin:6px 0 14px">Lat ${la.toFixed(4)}, Lon ${lo.toFixed(4)}</p>
      <a class="btn gold" style="text-decoration:none;margin-bottom:10px" target="_blank" rel="noopener" href="https://www.google.com/maps/search/iglesia+cat%C3%B3lica/@${la},${lo},15z">⛪ Iglesias católicas cercanas</a>
      <a class="btn ghost" style="text-decoration:none" target="_blank" rel="noopener" href="https://www.google.com/maps/search/horario+de+misa+iglesia/@${la},${lo},14z">🕑 Buscar horarios de misa</a>`;
  }, err=>{
    c.innerHTML='<p class="muted">No pudimos obtener tu ubicación ('+esc(err.message)+'). <a target="_blank" rel="noopener" href="https://www.google.com/maps/search/iglesia+catolica+cerca">Buscar iglesias en Mapas</a></p>';
  }, {enableHighAccuracy:false, timeout:10000});
}
let adTimer=null, adRemain=15*60, adTotal=15*60, adRunning=false, adMoment=0, adMinutes=15;
function renderAdorar(){
  renderTabs('adorar'); setHeader('Ante el Santísimo',false);
  clearInterval(adTimer); adRunning=false;
  view.innerHTML=`
    <p class="sub">Un rato de adoración guiada, para estar con Jesús presente en la Eucaristía.</p>
    <div>${[10,15,20,30].map(m=>`<span class="chip ${m===adMinutes?'on':''}" onclick="setAdMin(${m})">${m} min</span>`).join('')}</div>
    <div class="card hero" style="text-align:center">
      <canvas id="ring" class="ring" width="200" height="200"></canvas>
      <div style="display:flex;gap:10px;margin-top:6px">
        <button class="btn gold" id="adBtn" onclick="toggleAd()">▶ Comenzar</button>
        <button class="btn ghost" style="flex:0 0 30%" onclick="resetAd()">■</button>
      </div>
    </div>
    <div class="card hero">
      <div class="kicker" id="adK">Meditación · 1 de ${ADORATION.length}</div>
      <h2 class="t" id="adT" style="font-size:20px;margin:8px 0">${ADORATION[0][0]}</h2>
      <p class="verse" id="adP">${ADORATION[0][1]}</p>
      <div style="display:flex;justify-content:space-between;margin-top:10px">
        <button class="chip" onclick="moveMoment(-1)">‹ Anterior</button>
        <button class="chip" onclick="moveMoment(1)">Siguiente ›</button>
      </div>
    </div>`;
  drawRing();
}
function setAdMin(m){ adMinutes=m; adTotal=m*60; adRemain=m*60; adMoment=0; renderAdorar(); }
function toggleAd(){
  const b=document.getElementById('adBtn');
  if(adRunning){ clearInterval(adTimer); adRunning=false; b.textContent='▶ Reanudar'; return; }
  adRunning=true; b.textContent='⏸ Pausar';
  adTimer=setInterval(()=>{
    adRemain--;
    if(adRemain<=0){ adRemain=0; clearInterval(adTimer); adRunning=false; b.textContent='↻ De nuevo'; }
    const idx=Math.min(ADORATION.length-1, Math.floor((adTotal-adRemain)/adTotal*ADORATION.length));
    if(idx!==adMoment){ adMoment=idx; updMoment(); }
    drawRing();
  },1000);
}
function resetAd(){ clearInterval(adTimer); adRunning=false; adRemain=adTotal; adMoment=0; const b=document.getElementById('adBtn'); if(b)b.textContent='▶ Comenzar'; updMoment(); drawRing(); }
function moveMoment(d){ adMoment=Math.max(0,Math.min(ADORATION.length-1,adMoment+d)); updMoment(); }
function updMoment(){
  const K=document.getElementById('adK'); if(!K)return;
  K.textContent='Meditación · '+(adMoment+1)+' de '+ADORATION.length;
  document.getElementById('adT').textContent=ADORATION[adMoment][0];
  document.getElementById('adP').textContent=ADORATION[adMoment][1];
}
function drawRing(){
  const cv=document.getElementById('ring'); if(!cv)return; const ctx=cv.getContext('2d');
  const w=cv.width, r=80, cx=w/2, cy=w/2; ctx.clearRect(0,0,w,w);
  ctx.lineWidth=12; ctx.lineCap='round';
  ctx.strokeStyle='rgba(110,151,201,.35)'; ctx.beginPath(); ctx.arc(cx,cy,r,0,2*Math.PI); ctx.stroke();
  const pct=1-adRemain/adTotal;
  if(pct>0){ ctx.strokeStyle='#c68f2c'; ctx.beginPath(); ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+2*Math.PI*pct); ctx.stroke(); }
  ctx.fillStyle='#26344f'; ctx.textAlign='center'; ctx.font='500 40px Georgia,serif';
  const m=String(Math.floor(adRemain/60)).padStart(2,'0'), s=String(adRemain%60).padStart(2,'0');
  ctx.fillText(adRemain===0?'¡Amén!':m+':'+s, cx, cy+8);
  ctx.fillStyle='#c68f2c'; ctx.font='700 11px system-ui,sans-serif';
  ctx.fillText(adRemain===0?'COMPLETADA':'RESTANTES', cx, cy+30);
}

/* Arranque */
document.getElementById('spark').innerHTML=STAR;
bump(); renderPanel(); sendAnalytics();
go('inicio');
</script>
